<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ending Animado - Clinic Flow 360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #ffffff;
            overflow: hidden;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .collage-window {
            position: absolute;
            border-radius: 3rem;
            overflow: hidden;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.6);
            border: 4px solid rgba(255, 255, 255, 0.1);
        }

        .iframe-scaled {
            width: 1920px;
            height: 1080px;
            border: none;
            transform-origin: top left;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="stage" class="relative bg-gradient-to-br from-[#0f172a] via-[#1e293b] to-[#0f172a] flex flex-col items-center justify-center overflow-hidden" data-composition-id="promo-ending" data-start="0" data-duration="15" data-width="1920" data-height="1080" style="width: 1920px; height: 1080px;">
        
        <!-- Background Accents -->
        <div class="absolute top-0 left-0 w-[1000px] h-[1000px] bg-blue-500/10 rounded-full blur-[150px] -translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute bottom-0 right-0 w-[800px] h-[800px] bg-emerald-500/10 rounded-full blur-[150px] translate-x-1/3 translate-y-1/3"></div>

        <!-- Collage Windows -->
        
        <!-- Window 1: Dashboard (Top Left, Scale: 60%) -->
        <!-- Container width: 1920 * 0.55 = 1056, height: 1080 * 0.55 = 594 -->
        <div id="win-dashboard" class="collage-window z-10" style="width: 1056px; height: 594px; top: 100px; left: 100px;">
            <iframe src="dashboard-animado.html" class="iframe-scaled" style="transform: scale(0.55);"></iframe>
        </div>

        <!-- Window 2: Citas (Bottom Center, Scale: 50%) -->
        <!-- Container width: 1920 * 0.5 = 960, height: 1080 * 0.5 = 540 -->
        <div id="win-citas" class="collage-window z-20" style="width: 960px; height: 540px; bottom: 80px; left: 250px;">
            <iframe src="citas-animado.html" class="iframe-scaled" style="transform: scale(0.5);"></iframe>
        </div>

        <!-- Window 3: Odontograma (Right Center, Scale: 55%) -->
        <!-- Container width: 1920 * 0.55 = 1056, height: 1080 * 0.55 = 594 -->
        <div id="win-odontograma" class="collage-window z-30" style="width: 1056px; height: 594px; top: 220px; right: 100px;">
            <iframe src="odontograma-animado.html" class="iframe-scaled" style="transform: scale(0.55);"></iframe>
        </div>

        <!-- Black overlay for the text sequence -->
        <div id="text-overlay" class="absolute inset-0 bg-slate-900/60 backdrop-blur-md opacity-0 z-40 pointer-events-none transition-opacity"></div>

        <!-- Frase Final -->
        <div id="final-text-container" class="absolute inset-0 flex flex-col items-center justify-center z-50 pointer-events-none opacity-0">
            
            <div class="flex items-center gap-4 mb-8">
                <!-- Simple Logo simulation -->
                <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-emerald-400 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i data-lucide="activity" class="w-10 h-10 text-white"></i>
                </div>
                <h1 class="text-6xl font-black tracking-tight text-white">Clinic Flow <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">360</span></h1>
            </div>

            <p class="text-4xl text-slate-300 font-medium tracking-wide text-center max-w-4xl leading-tight">
                Menos clics, más tiempo para tus pacientes. <br>
                <span class="text-white font-bold mt-4 inline-block">Únete a la evolución clínica.</span>
            </p>
            
        </div>

    </div>

    <script>
        lucide.createIcons();

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        window.__timelines["promo-ending"] = tl;

        // Intro: Las ventanas entran desde diferentes lugares
        tl.from("#win-dashboard", { opacity: 0, x: -300, y: -100, rotation: -10, scale: 0.8, duration: 1.5, ease: "power3.out" }, 0.2);
        tl.from("#win-odontograma", { opacity: 0, x: 300, y: 100, rotation: 10, scale: 0.8, duration: 1.5, ease: "power3.out" }, 0.6);
        tl.from("#win-citas", { opacity: 0, y: 300, rotation: -5, scale: 0.8, duration: 1.5, ease: "power3.out" }, 1.0);

        // Flote continuo (Parallax)
        tl.to("#win-dashboard", { y: "-=30", rotation: "-=2", duration: 8, ease: "sine.inOut", yoyo: true, repeat: -1 }, 1.5);
        tl.to("#win-odontograma", { y: "+=30", rotation: "+=2", duration: 7, ease: "sine.inOut", yoyo: true, repeat: -1 }, 1.5);
        tl.to("#win-citas", { y: "-=20", x: "+=20", duration: 6, ease: "sine.inOut", yoyo: true, repeat: -1 }, 1.5);

        // A los 7 segundos, desenfocamos el fondo y mostramos el texto
        tl.to("#text-overlay", { opacity: 1, duration: 1.5, ease: "power2.inOut" }, 6.0);
        
        // El texto entra desde abajo
        tl.fromTo("#final-text-container", 
            { opacity: 0, y: 50, scale: 0.95 },
            { opacity: 1, y: 0, scale: 1, duration: 1.5, ease: "back.out(1.2)" }, 
            6.5
        );

        // Arrancar
        setTimeout(() => {
            if (!window.__hyperframes) {
                tl.play();
            }
        }, 100);
    </script>
</body>
</html>
